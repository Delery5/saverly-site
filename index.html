<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saverly</title>
  <meta
    name="description"
    content="Saverly is a budgeting mobile app for personal finance tracking."
  />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
    }

    .tagline {
      margin-top: 12px;
      font-size: 18px;
      color: #4b5563;
    }

    .badge {
      margin-top: 18px;
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 14px;
    }

    .section {
      margin-top: 30px;
      font-size: 16px;
      color: #374151;
      line-height: 1.6;
    }

    .contact {
      margin-top: 25px;
      font-size: 15px;
    }

    .contact a {
      color: #166534;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Saverly</h1>
    <p class="tagline">
      Budgeting mobile app for personal finance tracking.
    </p>

    <div class="badge">Coming soon to iOS & Android</div>

    <div class="section">
      Saverly helps users track spending, manage budgets, and stay in control of their finances with a simple and intuitive mobile experience.
    </div>

    <div class="contact">
      Contact:
      <a href="mailto:saverlymoney@gmail.com">saverlymoney@gmail.com</a>
    </div>

    <div class="footer">
      © 2026 Saverly Money LLC
    </div>
  </div>
</body>
</html>
